<button onclick="sendCommandToRoblox()">Дать 100 монет игроку</button>

<script>
async function sendCommandToRoblox() {
    const response = await fetch('https://ваш-внешний-сервер.com/api/send-command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            userId: 123,
            command: "giveCoins",
            amount: 100
        })
    });
    const result = await response.json();
    console.log(result.message);
}
</script>
